name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Capture build log on failure
        if: failure()
        run: |
          mkdir -p build-logs
          tail -c 120000 build.log > build-logs/failure-${{ github.run_id }}.log || echo "no log" > build-logs/failure-${{ github.run_id }}.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-logs/
          git diff --staged --quiet || git commit -m "CI: build failure log ${{ github.run_id }} [skip ci]"
          git push

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-studio-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Commit APK to releases
        if: github.ref == 'refs/heads/main' && success()
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/LauncherStudio-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/LauncherStudio-debug.apk
          git diff --staged --quiet || git commit -m "CI: update debug APK [skip ci]"
          git push
